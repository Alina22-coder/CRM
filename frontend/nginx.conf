server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://crm-aws.eu-north-1.elasticbeanstalk.com;
        proxy_set_header Host crm-aws.eu-north-1.elasticbeanstalk.com;
    }

    location /uploads/ {
        proxy_pass http://crm-aws.eu-north-1.elasticbeanstalk.com;
        proxy_set_header Host crm-aws.eu-north-1.elasticbeanstalk.com;
    }
}
