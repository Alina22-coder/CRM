<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5e81f4"/>
      <stop offset="100%" stop-color="#9698d6"/>
    </linearGradient>
  </defs>

  <!-- dark mode -->
  <g>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #1c1d21; }
        .dot1 { fill: #5e81f4; }
        .dot2 { fill: #7a8ff4; }
        .dot3 { fill: #9698d6; }
        .ln  { stroke-opacity: 0.45; }
      }
      @media (prefers-color-scheme: light) {
        .bg  { fill: #f5f5fa; }
        .dot1 { fill: #5e81f4; }
        .dot2 { fill: #7a8ff4; }
        .dot3 { fill: #9698d6; }
        .ln  { stroke-opacity: 0.3; }
      }
    </style>
    <rect class="bg" width="64" height="64" rx="14"/>
    <line class="ln" x1="32" y1="13" x2="13" y2="44" stroke="url(#g1)" stroke-width="1.5"/>
    <line class="ln" x1="32" y1="13" x2="51" y2="44" stroke="url(#g1)" stroke-width="1.5"/>
    <line class="ln" x1="13" y1="44" x2="51" y2="44" stroke="url(#g1)" stroke-width="1.5"/>
    <circle class="dot1" cx="32" cy="13" r="6"/>
    <circle class="dot2" cx="13" cy="44" r="6"/>
    <circle class="dot3" cx="51" cy="44" r="6"/>
  </g>
</svg>
